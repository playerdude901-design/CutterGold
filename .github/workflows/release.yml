name: Publicar Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar Dependencias
        run: npm ci
      - name: Verificar
        run: |
          npm test
          npm run lint
      - name: Compilar
        run: npm run build
      - name: Probar Electron y FFmpeg
        run: npx electron tests/electron-smoke.mjs
      - name: Compilar y Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
